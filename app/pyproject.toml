[project]
name = "shortener"
version = "0.1.0"
description = "A small URL shortener API backed by Redis"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.163.0",
    "prometheus-client>=0.26.0",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
